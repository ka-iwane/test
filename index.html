<!doctype html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="日々の写真を投稿して共有する、小さなフォトジャーナルです。">
	<title>LENS NOTE | Photo Journal</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&amp;family=Shippori+Mincho:wght@500;600;700&amp;display=swap" rel="stylesheet">
	<link rel="stylesheet" href="./css/style.css">
</head>
<body>
	<header class="site-header">
		<a class="brand" href="./" aria-label="LENS NOTE ホーム">
			<span class="brand-mark" aria-hidden="true"></span>
			<span>LENS NOTE</span>
		</a>
		<p class="header-copy">いつもの景色を、少し丁寧に。</p>
		<button class="button button-primary header-action" type="button" data-open-upload>
			<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
			写真を投稿
		</button>
	</header>

	<main>
		<section class="intro" aria-labelledby="page-title">
			<div>
				<p class="eyebrow">PHOTO JOURNAL</p>
				<h1 id="page-title">今日の一枚を<br>ここに残す。</h1>
			</div>
			<div class="intro-aside">
				<p>何気ない瞬間も、並べてみると自分だけの記録になる。写真と短い言葉で、今日を保存しよう。</p>
				<button class="text-button" type="button" data-open-upload>
					最初の写真を投稿する
					<svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
				</button>
			</div>
		</section>

		<section class="gallery-section" aria-labelledby="gallery-title">
			<div class="section-heading">
				<div>
					<p class="eyebrow">RECENT MOMENTS</p>
					<h2 id="gallery-title">みんなの記録</h2>
				</div>
				<p id="photo-count" class="photo-count" aria-live="polite">読み込み中</p>
			</div>

			<div id="status" class="status" role="status" aria-live="polite">
				<span class="loader" aria-hidden="true"></span>
				写真を読み込んでいます
			</div>

			<div id="gallery" class="gallery" aria-live="polite"></div>

			<div id="empty-state" class="empty-state" hidden>
				<span class="empty-frame" aria-hidden="true">
					<svg viewBox="0 0 24 24"><path d="M4 7h3l1.5-2h7L17 7h3v12H4zM8 13a4 4 0 1 0 8 0 4 4 0 0 0-8 0Z"/></svg>
				</span>
				<h3>まだ写真がありません</h3>
				<p>この場所の最初の一枚を投稿してみましょう。</p>
				<button class="button button-primary" type="button" data-open-upload>写真を投稿</button>
			</div>
		</section>
	</main>

	<dialog id="upload-dialog" class="upload-dialog">
		<form id="upload-form" class="upload-form" method="dialog">
			<div class="dialog-heading">
				<div>
					<p class="eyebrow">NEW MOMENT</p>
					<h2>写真を投稿</h2>
				</div>
				<button class="icon-button" type="button" data-close-dialog aria-label="閉じる" title="閉じる">
					<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
				</button>
			</div>

			<label id="drop-zone" class="drop-zone" for="photo-file">
				<input id="photo-file" name="photo" type="file" accept="image/jpeg,image/png,image/webp" required>
				<span id="drop-placeholder" class="drop-placeholder">
					<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h3l1.5-2h7L17 7h3v12H4zM8 13a4 4 0 1 0 8 0 4 4 0 0 0-8 0Z"/></svg>
					<strong>写真を選択</strong>
					<small>JPEG・PNG・WebP / 最大10MB</small>
				</span>
				<img id="image-preview" alt="選択した写真のプレビュー" hidden>
			</label>

			<div class="field-grid">
				<label class="field field-wide">
					<span>ひとこと <small>任意</small></span>
					<textarea id="caption" name="caption" maxlength="160" rows="3" placeholder="この瞬間について書く"></textarea>
					<span id="caption-count" class="character-count">0 / 160</span>
				</label>
				<label class="field">
					<span>撮影日 <small>任意</small></span>
					<input id="taken-at" name="taken_at" type="date">
				</label>
				<label class="field">
					<span>場所 <small>任意</small></span>
					<input id="location" name="location" type="text" maxlength="80" placeholder="例：東京">
				</label>
			</div>

			<p id="form-message" class="form-message" role="alert" hidden></p>

			<div class="dialog-actions">
				<button class="button button-secondary" type="button" data-close-dialog>キャンセル</button>
				<button id="submit-button" class="button button-primary" type="submit">
					<span>投稿する</span>
					<span class="button-loader" aria-hidden="true"></span>
				</button>
			</div>
		</form>
	</dialog>

	<dialog id="photo-dialog" class="photo-dialog">
		<button class="icon-button light close-photo" type="button" data-close-photo aria-label="写真を閉じる" title="閉じる">
			<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
		</button>
		<div id="photo-detail" class="photo-detail"></div>
	</dialog>

	<template id="photo-card-template">
		<article class="photo-card">
			<button class="photo-card-open" type="button">
				<img class="photo-card-image" alt="" loading="lazy">
				<span class="photo-card-overlay" aria-hidden="true">
					<svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>
				</span>
			</button>
			<div class="photo-card-info">
				<p class="photo-card-caption"></p>
				<div class="photo-card-meta"></div>
			</div>
		</article>
	</template>

	<footer>
		<span>LENS NOTE</span>
		<span>Powered by Supabase</span>
	</footer>

	<script type="module" src="./js/app.js"></script>
</body>
</html>
